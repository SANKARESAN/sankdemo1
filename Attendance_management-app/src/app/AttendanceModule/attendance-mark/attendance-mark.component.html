<div class="container mt-5">
  <div class="card shadow-lg">
      <div class="card-header bg-primary text-white">
          <h2 class="mb-0 text-center">Mark Attendance</h2>
      </div>
      <div class="card-body">
          <form>
              <div class="form-group">
                  <label for="attendanceDate" class="form-label">Select Date:</label>
                  <input type="date" id="attendanceDate" class="form-control" [(ngModel)]="attendanceDate" name="attendanceDate" required />
              </div>
              <button (click)="submitAttendance()" class="btn btn-primary mt-3">Submit Attendance</button>
          </form>
      </div>
  </div>
</div>
